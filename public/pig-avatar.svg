<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#ffe1ec"/>
      <stop offset="100%" stop-color="#ffc4dd"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb3cf"/>
      <stop offset="100%" stop-color="#ff9dc0"/>
    </linearGradient>
  </defs>

  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>

  <!-- back arm (flexing bicep) -->
  <g>
    <ellipse cx="150" cy="118" rx="16" ry="22" fill="url(#skin)"/>
    <circle cx="152" cy="98" r="14" fill="url(#skin)"/>
    <ellipse cx="152" cy="98" rx="8" ry="6" fill="#ff7fb0" opacity="0.6"/>
  </g>
  <g>
    <ellipse cx="50" cy="118" rx="16" ry="22" fill="url(#skin)"/>
    <circle cx="48" cy="98" r="14" fill="url(#skin)"/>
    <ellipse cx="48" cy="98" rx="8" ry="6" fill="#ff7fb0" opacity="0.6"/>
  </g>

  <!-- muscular torso -->
  <path d="M100 95
           C 70 95, 62 120, 66 150
           C 68 168, 84 180, 100 180
           C 116 180, 132 168, 134 150
           C 138 120, 130 95, 100 95 Z"
        fill="url(#skin)"/>
  <!-- pecs -->
  <path d="M78 118 C 84 132, 96 132, 100 120 C 104 132, 116 132, 122 118"
        fill="none" stroke="#e8779f" stroke-width="3" stroke-linecap="round"/>
  <!-- abs -->
  <line x1="100" y1="122" x2="100" y2="172" stroke="#e8779f" stroke-width="3" stroke-linecap="round"/>
  <line x1="82" y1="138" x2="118" y2="138" stroke="#e8779f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="84" y1="154" x2="116" y2="154" stroke="#e8779f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="86" y1="168" x2="114" y2="168" stroke="#e8779f" stroke-width="2.5" stroke-linecap="round"/>

  <!-- curly tail -->
  <path d="M137 152 q10 -4 8 6 q-2 8 -10 4" fill="none" stroke="url(#skin)" stroke-width="5" stroke-linecap="round"/>

  <!-- cute head -->
  <circle cx="100" cy="72" r="46" fill="url(#skin)"/>
  <!-- ears -->
  <path d="M62 42 Q52 20 74 28 Q70 44 62 42 Z" fill="url(#skin)"/>
  <path d="M138 42 Q148 20 126 28 Q130 44 138 42 Z" fill="url(#skin)"/>
  <path d="M65 38 Q60 26 72 30 Q70 40 65 38 Z" fill="#ff7fb0" opacity="0.7"/>
  <path d="M135 38 Q140 26 128 30 Q130 40 135 38 Z" fill="#ff7fb0" opacity="0.7"/>

  <!-- blush -->
  <ellipse cx="70" cy="80" rx="9" ry="6" fill="#ff7fb0" opacity="0.55"/>
  <ellipse cx="130" cy="80" rx="9" ry="6" fill="#ff7fb0" opacity="0.55"/>

  <!-- eyes -->
  <circle cx="82" cy="68" r="5.5" fill="#3a2b2b"/>
  <circle cx="118" cy="68" r="5.5" fill="#3a2b2b"/>
  <circle cx="83.5" cy="66" r="1.6" fill="#fff"/>
  <circle cx="119.5" cy="66" r="1.6" fill="#fff"/>

  <!-- snout -->
  <ellipse cx="100" cy="86" rx="20" ry="14" fill="#ff8fbb"/>
  <ellipse cx="92" cy="87" rx="3.5" ry="5" fill="#c95d84"/>
  <ellipse cx="108" cy="87" rx="3.5" ry="5" fill="#c95d84"/>

  <!-- smile -->
  <path d="M90 98 Q100 104 110 98" fill="none" stroke="#c95d84" stroke-width="2.5" stroke-linecap="round"/>

  <!-- sweatband -->
  <path d="M56 58 Q100 40 144 58 L144 50 Q100 32 56 50 Z" fill="#5aa9ff"/>
</svg>
